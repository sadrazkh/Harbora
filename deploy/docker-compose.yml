# Harbora platform stack. The installer templates the .env file consumed here.
# Traefik terminates TLS (Let's Encrypt) and reverse-proxies both the panel and every
# deployed app; Postgres and Redis back the platform itself.
services:
  traefik:
    # v3.6+ is required for Docker Engine 27+/29 (older Traefik negotiates Docker API 1.24 and
    # fails with "client version 1.24 is too old"). Pinned to the minor so patches are picked up.
    image: traefik:v3.6
    container_name: harbora-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/dynamic
      - harbora_acme:/acme
    networks:
      - harbora

  postgres:
    image: postgres:16-alpine
    container_name: harbora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - harbora_pgdata:/var/lib/postgresql/data
    networks:
      - harbora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: harbora-redis
    restart: unless-stopped
    volumes:
      - harbora_redis:/data
    networks:
      - harbora

  # Object storage for the Storage section: buckets, per-bucket keys and quotas.
  #
  # Published through Traefik on its own hostname rather than by opening a port on the host — the
  # S3 API has to be reachable by a customer's client, and 443 is already terminated and
  # certificate-managed. The console is deliberately not published: it is a second way in to every
  # bucket, authenticated separately from the panel.
  minio:
    image: quay.io/minio/minio@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    container_name: harbora-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # What a client is told to connect to, so pre-signed URLs are signed for the address the
      # customer actually uses rather than for the container name the panel reaches it by.
      MINIO_SERVER_URL: https://${S3_DOMAIN}
    volumes:
      - harbora_objects:/data
    networks:
      - harbora
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=harbora
      - traefik.http.routers.harbora-s3.rule=Host(`${S3_DOMAIN}`)
      - traefik.http.routers.harbora-s3.entrypoints=websecure
      - traefik.http.routers.harbora-s3.tls.certresolver=letsencrypt
      - traefik.http.services.harbora-s3.loadbalancer.server.port=9000

  panel:
    image: harbora/panel:latest
    # Build from the cloned repo on first run (no registry required). `docker compose up -d --build`.
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: harbora-panel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Harbora__MasterKey: ${HARBORA_MASTER_KEY}
      Traefik__DynamicConfigPath: "/dynamic/harbora.yml"
      Runtime__RootDomain: ${ROOT_DOMAIN}
      ASPNETCORE_ENVIRONMENT: Production
      # Surfaced so `harbora info` can report what the panel is actually configured with.
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      # Object storage. The panel administers MinIO over the platform network; customers are given
      # the public address, which is not the same string and must not be.
      Storage__S3__Endpoint: "http://minio:9000"
      Storage__S3__PublicEndpoint: "https://${S3_DOMAIN}"
      Storage__S3__AccessKey: ${MINIO_ROOT_USER}
      Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD}
    # Without this a panel whose process has died or hung stays "running" forever: Docker never
    # restarts it, and every request gets a 502 with nothing to explain why. Observed in production.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    volumes:
      # The panel talks to Docker directly (single-server mode) and writes proxy config.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic:/dynamic
      - harbora_builds:/var/lib/harbora/builds
      # Shared with one-off tar containers so backup artifacts are visible to both.
      - harbora_backups:/var/lib/harbora/backups
      # Data Protection keyring. Without this, rebuilding the image signs every user out.
      - harbora_keys:/var/lib/harbora/keys
    labels:
      - traefik.enable=true
      # Pin the network Traefik uses to reach the panel — it joins tenant networks too, and
      # without this it can pick the wrong one and serve 404/502.
      - traefik.docker.network=harbora
      - traefik.http.routers.harbora.rule=Host(`${PANEL_DOMAIN}`)
      - traefik.http.routers.harbora.entrypoints=websecure
      - traefik.http.routers.harbora.tls.certresolver=letsencrypt
      - traefik.http.services.harbora.loadbalancer.server.port=8080
    networks:
      - harbora

networks:
  harbora:
    name: harbora
    external: false

volumes:
  harbora_objects:
  harbora_pgdata:
  harbora_redis:
  harbora_acme:
  harbora_builds:
  harbora_backups:
    # Explicit name so Compose does NOT prefix it with the project directory ("deploy_").
    # The panel mounts this volume, and separately asks Docker to mount it by name into the one-off
    # tar/untar containers. With prefixing those were two DIFFERENT volumes: every volume backup was
    # written somewhere the panel could never read, and a restore would have wiped the target volume
    # and then failed to find the archive.
    name: harbora_backups
  harbora_keys:
