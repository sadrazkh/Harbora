# Harbora platform stack. The installer templates the .env file consumed here.
# Traefik terminates TLS (Let's Encrypt) and reverse-proxies both the panel and every
# deployed app; Postgres backs the platform itself, and MinIO holds objects.
#
# The redis service below is started and used by nothing. The queue is Postgres — see
# DatabaseJobQueue and the Jobs table. It is left running rather than removed because taking a
# service out of a running stack is an upgrade decision, not a comment-fixing one (HARBORA-0052).
services:
  traefik:
    # v3.6+ is required for Docker Engine 27+/29 (older Traefik negotiates Docker API 1.24 and
    # fails with "client version 1.24 is too old"). Pinned to the minor so patches are picked up.
    image: traefik:v3.6
    container_name: harbora-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Which ACME directory to ask for certificates. The default is Let's Encrypt production and is
      # byte-identical to what Traefik uses when the flag is absent, so an existing install that
      # never sets ACME_CA_SERVER behaves exactly as it did before this line existed.
      #
      # It is here for deploy/live-host-proof.sh, which installs a whole panel and takes real
      # certificates on every run. Against production that burns the five-duplicate-certificates-per
      # -week limit and the lane starts failing by midweek; against staging the handshake is real and
      # the issuer is checkable, which is what the proof actually asserts. Operators should leave it
      # alone — a staging certificate is not trusted by browsers.
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Kept available even in direct-DNS mode so an Owner can activate Cloudflare from the panel
      # without rebuilding containers. The provider reads its token from the mounted secret file.
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/acme/cloudflare.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.cloudflare.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    environment:
      CF_DNS_API_TOKEN_FILE: /dynamic/secrets/cloudflare-token
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/dynamic
      - harbora_acme:/acme
    networks:
      - harbora

  postgres:
    image: postgres:16-alpine
    container_name: harbora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - harbora_pgdata:/var/lib/postgresql/data
    networks:
      - harbora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: harbora-redis
    restart: unless-stopped
    volumes:
      - harbora_redis:/data
    networks:
      - harbora

  # Object storage for the Storage section: buckets, per-bucket keys and quotas.
  #
  # Published through Traefik on its own hostname rather than by opening a port on the host — the
  # S3 API has to be reachable by a customer's client, and 443 is already terminated and
  # certificate-managed. The console is deliberately not published: it is a second way in to every
  # bucket, authenticated separately from the panel.
  minio:
    image: quay.io/minio/minio@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    container_name: harbora-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # What a client is told to connect to, so pre-signed URLs are signed for the address the
      # customer actually uses rather than for the container name the panel reaches it by.
      MINIO_SERVER_URL: https://${S3_DOMAIN}
    volumes:
      - harbora_objects:/data
    networks:
      - harbora
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=harbora
      - traefik.http.routers.harbora-s3.rule=Host(`${S3_DOMAIN}`)
      - traefik.http.routers.harbora-s3.entrypoints=websecure
      - traefik.http.routers.harbora-s3.tls.certresolver=${ACME_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.harbora-s3.loadbalancer.server.port=9000

  panel:
    image: harbora/panel:latest
    # Build from the cloned repo on first run (no registry required). `docker compose up -d --build`.
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: harbora-panel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Harbora__MasterKey: ${HARBORA_MASTER_KEY}
      Traefik__DynamicConfigPath: "/dynamic/harbora.yml"
      Runtime__RootDomain: ${ROOT_DOMAIN}
      # Resolver and trusted-hop settings are parameterised so the optional Cloudflare overlay can
      # switch managed routes to DNS-01 and recover the visitor through Cloudflare + Traefik.
      Traefik__CertResolver: ${ACME_CERT_RESOLVER:-letsencrypt}
      Traefik__ForwardedClientIpDepth: ${FORWARDED_CLIENT_IP_DEPTH:-0}
      Traefik__CloudflareEnabledMarkerPath: /dynamic/cloudflare.enabled
      Harbora__TrustedProxyNetworks: ${TRUSTED_PROXY_NETWORKS:-}
      Harbora__TrustedProxyHops: ${TRUSTED_PROXY_HOPS:-2}
      Cloudflare__TokenFilePath: /dynamic/secrets/cloudflare-token
      Cloudflare__DynamicConfigPath: /dynamic/cloudflare.yml
      Cloudflare__EnabledMarkerPath: /dynamic/cloudflare.enabled
      # Hosted-PaaS default: an unfunded workspace cannot allocate billable resources. Private
      # installations may deliberately opt out with BILLING_ENABLED=false.
      Billing__Enabled: ${BILLING_ENABLED:-true}
      Billing__Currency: ${BILLING_CURRENCY:-IRR}
      Billing__MaxBackfillHours: ${BILLING_MAX_BACKFILL_HOURS:-72}
      ASPNETCORE_ENVIRONMENT: Production
      # Surfaced so `harbora info` can report what the panel is actually configured with.
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      # Object storage. The panel administers MinIO over the platform network; customers are given
      # the public address, which is not the same string and must not be.
      Storage__S3__Endpoint: "http://minio:9000"
      Storage__S3__PublicEndpoint: "https://${S3_DOMAIN}"
      Storage__S3__AccessKey: ${MINIO_ROOT_USER}
      Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD}
      # The node channel. PublicUrl is the mTLS host (NODE_DOMAIN) an enrolled node is handed and
      # keeps calling afterwards — deliberately not this panel's own host, because two routers on
      # one host name with different TLS options make Traefik fall back to options that ask for no
      # client certificate. The flag lets the panel believe Traefik's X-Forwarded-Tls-Client-Cert,
      # which is only safe because traefik/dynamic/node-agent.yml requires a client certificate and
      # therefore always overwrites that header. install.sh writes the flag only once that router is
      # on disk.
      #
      # Defaults, so a .env written before those keys existed does not stop the panel — but they are
      # a way to boot, not a working configuration. An empty PublicUrl is handed to the node as an
      # empty ControlPlaneUrl (NodeEnrollmentService), which EnrollmentService stores verbatim; the
      # agent then reads `state.ControlPlaneUrl ?? _options.ControlPlaneUrl`, and `??` does not catch
      # an empty string. There is no fallback to the URL it was installed with: ControlChannel builds
      # its channel URI from "" and throws UriFormatException on every attempt. The node enrols,
      # reports success, and never opens a channel. install.sh checks both values in verify_install
      # for exactly that reason.
      # The flag at least fails closed rather than binding "" to a bool and throwing on startup.
      NodeAgent__PublicUrl: ${NodeAgent__PublicUrl:-}
      NodeAgent__TrustForwardedClientCertificate: ${NodeAgent__TrustForwardedClientCertificate:-false}
    # Without this a panel whose process has died or hung stays "running" forever: Docker never
    # restarts it, and every request gets a 502 with nothing to explain why. Observed in production.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    volumes:
      # The panel talks to Docker directly (single-server mode) and writes proxy config.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic:/dynamic
      - harbora_builds:/var/lib/harbora/builds
      # Shared with one-off tar containers so backup artifacts are visible to both.
      - harbora_backups:/var/lib/harbora/backups
      # Data Protection keyring. Without this, rebuilding the image signs every user out.
      - harbora_keys:/var/lib/harbora/keys
    labels:
      - traefik.enable=true
      # Pin the network Traefik uses to reach the panel — it joins tenant networks too, and
      # without this it can pick the wrong one and serve 404/502.
      - traefik.docker.network=harbora
      - traefik.http.routers.harbora.rule=Host(`${PANEL_DOMAIN}`)
      - traefik.http.routers.harbora.entrypoints=websecure
      - traefik.http.routers.harbora.tls.certresolver=${ACME_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.harbora.loadbalancer.server.port=8080
    networks:
      - harbora

networks:
  harbora:
    name: harbora
    external: false

volumes:
  harbora_objects:
  harbora_pgdata:
  harbora_redis:
  harbora_acme:
  harbora_builds:
  harbora_backups:
    # Explicit name so Compose does NOT prefix it with the project directory ("deploy_").
    # The panel mounts this volume, and separately asks Docker to mount it by name into the one-off
    # tar/untar containers. With prefixing those were two DIFFERENT volumes: every volume backup was
    # written somewhere the panel could never read, and a restore would have wiped the target volume
    # and then failed to find the archive.
    name: harbora_backups
  harbora_keys:
