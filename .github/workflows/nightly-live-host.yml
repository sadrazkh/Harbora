name: Nightly — live-host proof

# The R0 proof: the README's install-and-deploy claim, walked on real hosts, every night.
#
# This workflow is the TRIGGER. The proof itself is deploy/live-host-proof.sh, which an operator can
# run by hand on a VPS with no GitHub involved — that is deliberate, because the half of this
# deliverable that outlives any CI system is the script. Everything below does three things: check
# that the lane is configured, put the script under test on the host, and run it.
#
# ── What an operator must provide ────────────────────────────────────────────────────────────────
#
# Two disposable hosts and a DNS zone. Both hosts are re-usable between runs only because the
# script tears down what it created on success (E2E_TEARDOWN=1 below); a FAILED run deliberately
# leaves the host installed so it can be inspected, and the next run then refuses at its first
# precondition rather than building a "fresh install" claim on last night's leftovers. When that
# happens, re-image both hosts.
#
#   Secret              What it is
#   ──────────────────  ────────────────────────────────────────────────────────────────────────
#   E2E_SSH_HOST        Address of the disposable PANEL host. Root SSH, ports 80/443 open.
#   E2E_SSH_USER        User to connect as (root, or one with passwordless sudo).
#   E2E_SSH_KEY         Private key for the panel host, PEM.
#   E2E_NODE_HOST       Address of the SECOND disposable host, enrolled as a node.
#   E2E_NODE_SSH_KEY    Private key for the node host, PEM. Copied to the panel host for the run,
#                       because it is the panel host that installs the agent over SSH.
#   E2E_PANEL_DOMAIN    e.g. panel.e2e.example.com   → A record to E2E_SSH_HOST
#   E2E_ROOT_DOMAIN     e.g. apps.e2e.example.com    → *.<this> A record to E2E_SSH_HOST
#   E2E_ACME_EMAIL      Registration address for the ACME account.
#   E2E_OWNER_EMAIL     The owner account the wizard creates. Throwaway.
#   E2E_OWNER_PASSWORD  Its password, 8+ characters. Throwaway.
#
#   DNS, all A records pointing at E2E_SSH_HOST:
#     $E2E_PANEL_DOMAIN
#     nodes.$E2E_PANEL_DOMAIN      the node channel's mTLS host
#     *.$E2E_ROOT_DOMAIN           the wildcard every deployed app is published under
#
# Certificates come from Let's Encrypt STAGING, so none of this consumes production rate limit and
# the certificates are not trusted by anything outside the run.

on:
  schedule:
    # 03:00 UTC. Nothing depends on the hour beyond it being quiet.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'Install this ref first (the "previous release")'
        required: false
        default: 'master'
      to_ref:
        description: 'Then upgrade to this ref (the one under test)'
        required: false
        default: ''

# ── When this goes red ───────────────────────────────────────────────────────────────────────────
#
# A failed run deliberately leaves the panel host installed so it can be inspected, which means
# EVERY LATER RUN WILL REFUSE at step 0 until somebody acts. That is correct — it is what stops a
# "fresh install" claim being built on last night's leftovers — but it also means one bad night
# turns into red every night, and a lane that is always red is a lane people stop reading.
#
# So: a red run means RE-IMAGE BOTH HOSTS (or clean them by hand, following the paths the script
# names) before the next one can say anything. The failure step below opens or updates a GitHub
# issue so that this is somebody's job rather than a tick nobody watches.
#
# Two things no workflow can fix from the inside, both of which end with this lane going quiet:
#
#   1. GitHub disables `schedule:` triggers after 60 days with no repository activity. It is
#      DOCUMENTED that this happens; it is NOT documented what counts as activity, and the issue the
#      failure step opens is created by github.token, whose events GitHub treats specially in other
#      contexts. So do not assume a failing lane keeps itself alive — it may or may not. If this
#      repository ever goes quiet for two months, check that the schedule is still enabled before
#      trusting its silence.
#
#   2. The failure step itself can fail — issues disabled on the repository, an org policy, a GitHub
#      API outage — and when it does it goes red inside a job that is already red, which is the one
#      place nobody is looking. There is no way to notice that from in here. If red nights stop
#      producing issue comments, the notification is what broke, not necessarily the product.

permissions:
  contents: read
  issues: write   # the failure step below opens/updates one issue; nothing else needs write

# Two runs sharing one pair of hosts would tread on each other, and the loser would report a
# failure that says nothing about the code. Queue instead of cancelling: a half-finished run that
# was killed mid-install leaves exactly the dirty host the script refuses to work on.
concurrency:
  group: live-host-proof
  cancel-in-progress: false

jobs:
  proof:
    name: Install, deploy, certificate, backup, node, upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # A lane whose secrets are half-configured must not run at all. Without this the run would get
      # as far as SSH, fail with something unhelpful, and look like a product failure rather than a
      # setup failure — and a lane people learn to ignore is a lane that proves nothing.
      - name: Every secret this lane needs must be configured
        env:
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
          E2E_SSH_KEY: ${{ secrets.E2E_SSH_KEY }}
          E2E_NODE_HOST: ${{ secrets.E2E_NODE_HOST }}
          E2E_NODE_SSH_KEY: ${{ secrets.E2E_NODE_SSH_KEY }}
          E2E_PANEL_DOMAIN: ${{ secrets.E2E_PANEL_DOMAIN }}
          E2E_ROOT_DOMAIN: ${{ secrets.E2E_ROOT_DOMAIN }}
          E2E_ACME_EMAIL: ${{ secrets.E2E_ACME_EMAIL }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
        run: |
          missing=""
          for name in E2E_SSH_HOST E2E_SSH_USER E2E_SSH_KEY E2E_NODE_HOST E2E_NODE_SSH_KEY \
                      E2E_PANEL_DOMAIN E2E_ROOT_DOMAIN E2E_ACME_EMAIL E2E_OWNER_EMAIL E2E_OWNER_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::The live-host proof is not configured. Missing secret(s):${missing}. See the comment at the top of this workflow for what each one is."
            exit 1
          fi
          echo "ok  all ten secrets are present."

      - name: Write the SSH keys
        env:
          PANEL_KEY: ${{ secrets.E2E_SSH_KEY }}
          NODE_KEY: ${{ secrets.E2E_NODE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PANEL_KEY" > ~/.ssh/panel_key
          printf '%s\n' "$NODE_KEY"  > ~/.ssh/node_key
          chmod 600 ~/.ssh/panel_key ~/.ssh/node_key

      # The script from THIS checkout, not whatever happens to be on the host. The whole point is to
      # test the ref under test, and a host that keeps its own copy would quietly test yesterday's.
      - name: Put the proof script (and the node's key) on the panel host
        env:
          HOST: ${{ secrets.E2E_SSH_HOST }}
          USER: ${{ secrets.E2E_SSH_USER }}
        run: |
          scp -i ~/.ssh/panel_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            deploy/live-host-proof.sh "${USER}@${HOST}:/tmp/live-host-proof.sh"
          scp -i ~/.ssh/panel_key -o StrictHostKeyChecking=accept-new \
            ~/.ssh/node_key "${USER}@${HOST}:/tmp/e2e_node_key"
          ssh -i ~/.ssh/panel_key -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" 'chmod 600 /tmp/e2e_node_key && chmod 700 /tmp/live-host-proof.sh'

      # E2E_SKIP_NODE is deliberately never set here. The script offers it so an operator with one
      # VPS can still run the rest by hand; a scheduled lane that quietly proved less than it claims
      # is the exact failure this whole task exists to close. The assertion after this step refuses
      # a run that skipped the node half anyway, so the two cannot drift.
      - name: Run the proof
        env:
          HOST: ${{ secrets.E2E_SSH_HOST }}
          USER: ${{ secrets.E2E_SSH_USER }}
          E2E_PANEL_DOMAIN: ${{ secrets.E2E_PANEL_DOMAIN }}
          E2E_ROOT_DOMAIN: ${{ secrets.E2E_ROOT_DOMAIN }}
          E2E_ACME_EMAIL: ${{ secrets.E2E_ACME_EMAIL }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_NODE_HOST: ${{ secrets.E2E_NODE_HOST }}
          FROM_REF: ${{ inputs.from_ref || 'master' }}
          TO_REF: ${{ inputs.to_ref || github.ref_name }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/panel_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 "${USER}@${HOST}" \
              "sudo env \
                 E2E_PANEL_DOMAIN='${E2E_PANEL_DOMAIN}' \
                 E2E_ROOT_DOMAIN='${E2E_ROOT_DOMAIN}' \
                 E2E_ACME_EMAIL='${E2E_ACME_EMAIL}' \
                 E2E_OWNER_EMAIL='${E2E_OWNER_EMAIL}' \
                 E2E_OWNER_PASSWORD='${E2E_OWNER_PASSWORD}' \
                 E2E_NODE_HOST='${E2E_NODE_HOST}' \
                 E2E_NODE_SSH_KEY=/tmp/e2e_node_key \
                 E2E_FROM_REF='${FROM_REF}' \
                 E2E_TO_REF='${TO_REF}' \
                 E2E_REPO_URL='${{ github.server_url }}/${{ github.repository }}' \
                 E2E_REPO_RAW='https://raw.githubusercontent.com/${{ github.repository }}' \
                 E2E_TEARDOWN=1 \
                 bash /tmp/live-host-proof.sh" 2>&1 | tee proof.log

      # The script exits non-zero on any failure, so this is not the primary gate — it is the guard
      # against a run that somehow exits 0 without having done the work. Both conditions matter: the
      # banner is only printed by the last line of the script, and "NOT TESTED" is only printed when
      # the node half was skipped, which this lane must never accept.
      - name: The proof must have run in full
        if: always()
        run: |
          if [ ! -s proof.log ]; then
            echo "::error::No output was captured, so nothing can be said about whether the proof ran."
            exit 1
          fi
          if grep -q 'NOT TESTED' proof.log; then
            echo "::error::The run skipped part of the proof (E2E_SKIP_NODE). A scheduled lane must never do that — it would report success for the node feature without testing it."
            exit 1
          fi
          if ! grep -q 'The live-host proof passed' proof.log; then
            echo "::error::The proof did not reach its success banner, so it did not complete."
            tail -40 proof.log
            exit 1
          fi
          echo "ok  the proof ran end to end, node half included."

      # proof.log is written by `tee`, and GitHub's secret masking applies to the LOG STREAM — not
      # to a file on disk, not to an uploaded artifact, and not to an issue body. The log routinely
      # contains the panel and root domains, the host's public address, the owner's email address
      # and, on a step-7 failure, the first 20 characters of a live enrolment token. All but the
      # token are configured as repository secrets, and this repository is public, so the raw log is
      # never what gets published: the redacted copy is uploaded and quoted instead.
      - name: Redact the log before anything publishes it
        if: always()
        env:
          E2E_PANEL_DOMAIN: ${{ secrets.E2E_PANEL_DOMAIN }}
          E2E_ROOT_DOMAIN: ${{ secrets.E2E_ROOT_DOMAIN }}
          E2E_ACME_EMAIL: ${{ secrets.E2E_ACME_EMAIL }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_NODE_HOST: ${{ secrets.E2E_NODE_HOST }}
        run: |
          [ -f proof.log ] || { echo "No proof.log to redact."; exit 0; }
          python3 - <<'PY'
          import os, re
          text = open('proof.log', errors='replace').read()
          for name in ('E2E_OWNER_PASSWORD', 'E2E_PANEL_DOMAIN', 'E2E_ROOT_DOMAIN',
                       'E2E_ACME_EMAIL', 'E2E_OWNER_EMAIL', 'E2E_SSH_HOST', 'E2E_NODE_HOST'):
              value = os.environ.get(name, '')
              if value:
                  text = text.replace(value, f'<{name}>')
          # Any remaining IPv4 literal: the script prints the host's public address at step 0, and
          # the node host's address appears in ssh diagnostics that no substitution above covers.
          text = re.sub(r'\b\d{1,3}(?:\.\d{1,3}){3}\b', '<ip>', text)
          # The enrolment token prefix the script logs deliberately as a correlation aid.
          text = re.sub(r'(prefix\s+)\S+', r'\1<token>', text)
          open('proof.redacted.log', 'w').write(text)
          PY
          echo "Redacted log written."

      # Nobody watches a nightly they did not break. A red tick on a scheduled run is seen by
      # exactly the people already looking at the Actions tab, which on a quiet night is nobody —
      # and because a failure leaves the hosts dirty, every subsequent run also fails, so the signal
      # decays into wallpaper within a week.
      #
      # One issue, reused. Reused rather than one-per-night because seven identical issues is the
      # same wallpaper in a different room; a single issue that keeps gaining comments shows both
      # that it is still broken and how long it has been.
      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --color B60205 \
            --description 'The nightly live-host proof is failing' --force >/dev/null 2>&1 || true

          {
            echo "The nightly live-host proof failed."
            echo
            echo "- Run: $RUN_URL"
            echo "- Commit: \`${{ github.sha }}\`"
            echo
            echo "**Both hosts must be re-imaged before the next run can prove anything.** A failed"
            echo "run leaves the panel host installed on purpose so it can be inspected, and the"
            echo "script then refuses at step 0 on every later run rather than claiming a fresh"
            echo "install it did not do. Until they are re-imaged, expect this to stay red."
            echo
            # The REDACTED copy, never proof.log. This repository is public and an issue body is
            # not covered by GitHub's secret masking, which only applies to the live log stream.
            if [ -s proof.redacted.log ]; then
              echo "<details><summary>Last 60 lines (redacted — domains, addresses, email and token elided)</summary>"
              echo
              echo '```'
              tail -60 proof.redacted.log
              echo '```'
              echo
              echo "</details>"
              echo
              echo "The full redacted log is attached to the run as an artifact."
            else
              echo "_No log was produced — the run failed before the script started_"
              echo "_(most likely a missing secret; see the first step)._"
            fi
          } > issue-body.md

          existing="$(gh issue list --state open --label nightly-failure --limit 1 \
                        --json number --jq '.[0].number // empty' || true)"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
            echo "Commented on existing issue #$existing."
          else
            gh issue create --title 'Nightly live-host proof is failing' \
              --label nightly-failure --body-file issue-body.md
          fi

      - name: Always clean the keys off the runner
        if: always()
        run: rm -f ~/.ssh/panel_key ~/.ssh/node_key

      # The redacted copy, not proof.log. Artifacts on a public repository are downloadable by
      # anyone, and the raw log carries values configured as secrets. If you need the unredacted
      # detail, it is on the host — which a failed run deliberately leaves standing.
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-host-proof-log
          path: proof.redacted.log
          if-no-files-found: warn
