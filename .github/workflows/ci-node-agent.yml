name: CI — node agent

# Separate from ci.yml so the node agent's suite — including the tests that need a real Docker
# daemon — runs on every change without touching the panel's existing gate.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Harbora.NodeAgent/Harbora.NodeAgent.csproj -c Release

      # ubuntu-latest ships a running daemon, so DockerIntegrationTests execute here rather than
      # reporting the environmental skip a developer sees locally.
      - name: Docker is available
        run: docker version --format '{{.Server.Version}}'

      - name: Test
        run: dotnet test tests/Harbora.NodeAgent.Tests/Harbora.NodeAgent.Tests.csproj -c Release --verbosity normal

      # The suite is meaningless if the container tests silently stopped running.
      - name: Fail if the Docker integration tests were skipped
        run: |
          dotnet test tests/Harbora.NodeAgent.Tests/Harbora.NodeAgent.Tests.csproj -c Release \
            --filter "FullyQualifiedName~DockerIntegrationTests" \
            --logger "trx;LogFileName=docker.trx" --results-directory ./trx

          if grep -q 'outcome="NotExecuted"' ./trx/docker.trx; then
            echo "::error::Docker integration tests were skipped on a runner that has Docker."
            exit 1
          fi

      # The gateway and the agent run against each other here: real sockets, real mTLS, real HTTP.
      # Every way ingress breaks is a disagreement between the two codebases, and this is the only
      # suite with both of them in the room.
      - name: End-to-end ingress tunnel
        run: dotnet test tests/Harbora.NodeIngress.Tests/Harbora.NodeIngress.Tests.csproj -c Release --verbosity normal

  publish-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The agent is shipped as a self-contained single file. A build that only works on the
      # developer's framework-dependent path is a release that fails at tag time.
      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/Harbora.NodeAgent/Harbora.NodeAgent.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none -o out

          test -x out/harbora-node-agent

  scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for script in deploy/node-agent/*.sh; do
            bash -n "$script"
            echo "ok  $script"
          done

      - name: systemd unit parses
        run: systemd-analyze verify deploy/node-agent/harbora-node-agent.service || true
