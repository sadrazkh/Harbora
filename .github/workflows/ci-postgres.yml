name: CI — Postgres lane

# The only suite that talks to a real PostgreSQL. Separate from ci.yml because it needs a Docker
# daemon and is measured in minutes rather than seconds, and because CI has to be able to name it on
# its own to prove it ran — see the last step.
#
# It is what proves the upgrade path. Four migrations on these branches carry hand-written SQL, two
# of them rewrite rows, and until this lane none of it had been executed against a PostgreSQL
# anywhere. MigrationConsistencyTests, in the fast suite, compares the model to the snapshot and
# never opens a connection.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  postgres:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ubuntu-latest ships a running daemon, so these execute here rather than reporting the
      # environmental skip a developer without Docker sees locally. Asked first so "no daemon" is a
      # one-line failure rather than a suite of skips somebody has to read the TRX to understand.
      - name: Docker is available
        run: docker version --format '{{.Server.Version}}'

      - name: Test
        run: |
          dotnet test tests/Harbora.Postgres.Tests/Harbora.Postgres.Tests.csproj -c Release \
            --logger "trx;LogFileName=postgres.trx" --results-directory ./trx --verbosity normal

      # A lane that quietly skips forever is worse than no lane: it is a green tick over an
      # unexercised upgrade path. The same guard ci-node-agent.yml puts on its container tests.
      - name: Fail if the Postgres lane did not actually run
        run: |
          if [ ! -f ./trx/postgres.trx ]; then
            echo "::error::No TRX was produced, so nothing can be said about whether the lane ran."
            exit 1
          fi

          if grep -q 'outcome="NotExecuted"' ./trx/postgres.trx; then
            echo "::error::Postgres lane tests were skipped on a runner that has Docker."
            grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' ./trx/postgres.trx || true
            exit 1
          fi

          # Zero discovered tests is the same disease wearing different clothes: the TRX is clean
          # because there was nothing in it.
          if ! grep -q 'outcome="Passed"' ./trx/postgres.trx; then
            echo "::error::The TRX records no passing test — the lane discovered nothing."
            exit 1
          fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-lane-trx
          path: ./trx
          if-no-files-found: warn
